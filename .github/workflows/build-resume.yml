name: Build Resume

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Resume
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install latex
        id: install_latex
        run: |
          sudo apt-get update
          sudo apt-get install texlive-full

      - name: Build resume
        run: make

      - name: Calculate New Hendrix API Version
        id: versioning
        uses: codacy/git-version@e81d6fdad74f9e114420d69ca8b47658f1182afb # v2.8.7

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.versioning.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            resume.pdf resume-twocol.pdf
